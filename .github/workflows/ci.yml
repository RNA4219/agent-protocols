name: agent-protocols-v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run generate:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:package

  migration:
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run tests/v2/protocol-v2.test.ts

  shipyard-conformance:
    runs-on: ubuntu-latest
    needs: protocol
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-protocols
      - uses: actions/checkout@v4
        with:
          repository: RNA4219/shipyard-cp
          path: shipyard-cp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build beta package
        working-directory: agent-protocols
        run: npm ci && npm run build && npm pack --pack-destination ../shipyard-cp
      - name: Install and typecheck Shipyard
        working-directory: shipyard-cp
        run: npm install --no-audit --no-fund ./rna4219-agent-protocols-2.0.0-beta.1.tgz && npm run check
